name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q cloud_run_jobs tools
      - name: Lint critical correctness rules
        run: ruff check cloud_run_jobs tools
      - name: Test repository-safe suite
        run: pytest -m "not private_artifacts"
